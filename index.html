<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Cotizador AT&amp;T</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;min-height:100vh}
.header{background:linear-gradient(135deg,#00b0f0,#0067c5);padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.logo{background:#fff;border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#0067c5;flex-shrink:0;line-height:1.1;text-align:center}
.header h1{font-size:17px;font-weight:800}
.header p{font-size:11px;opacity:.85}
.container{padding:12px;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.card-title{font-weight:700;font-size:14px;color:#222;margin-bottom:10px}
input[type=text],input[type=number]{width:100%;border:1.5px solid #d0d7df;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none}
input[type=text]:focus,input[type=number]:focus{border-color:#00b0f0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab-btn{padding:9px 0;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:12px;background:#e8ecf2;color:#555;font-family:inherit;transition:all .2s;flex:1}
.tab-btn.active{background:#00b0f0;color:#fff}
.plans-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan-btn{padding:10px;border-radius:10px;border:2px solid #e0e0e0;cursor:pointer;background:#fafafa;text-align:left;font-family:inherit;transition:all .15s;width:100%}
.plan-btn.sel{border-color:#00b0f0;background:#e3f4fd}
.plan-name{font-weight:800;font-size:13px}
.plan-detail{font-size:11px;color:#666;margin-top:2px}
.plazo-row{display:flex;gap:8px;margin-top:10px}
.plazo-btn{flex:1;padding:8px;border-radius:8px;border:2px solid #d0d7df;background:#fafafa;font-weight:700;font-size:12px;cursor:pointer;color:#555;font-family:inherit;transition:all .15s}
.plazo-btn.sel{border-color:#00b0f0;background:#e3f4fd;color:#0067c5}
.device-list{max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.device-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:2px solid #e8ecf0;margin-bottom:6px;cursor:pointer;background:#fff;transition:all .15s}
.device-item.sel{border-color:#00b0f0;background:#e3f4fd}
.d-icon{font-size:22px;flex-shrink:0}
.d-name{font-weight:600;font-size:13px;color:#111}
.d-price{font-size:11px;color:#888}
.summary-box{border-radius:10px;padding:14px;margin-bottom:12px}
.s-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:13px}
.s-label{color:#555}
.s-val{font-weight:700;color:#111}
.s-total{font-size:15px!important;color:#00b0f0!important;font-weight:900!important}
.divider{height:1px;background:#d0d7df;margin:8px 0}
.btn-add{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#00b0f0,#0067c5);color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;margin-top:4px}
.btn-add:disabled{background:#c5cdd6;cursor:default}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;color:#fff;margin-bottom:8px}
/* enganche */
.enganche-row{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pct-btn{padding:6px 12px;border-radius:8px;border:2px solid #d0d7df;background:#fafafa;font-weight:700;font-size:12px;cursor:pointer;color:#555;font-family:inherit;transition:all .15s}
.pct-btn.sel{border-color:#00b0f0;background:#e3f4fd;color:#0067c5}
.enganche-input{width:70px!important;text-align:center}
/* quote cards */
.quote-card{background:#fff;border:1.5px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:10px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.q-remove{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;color:#e53935;font-size:20px;font-weight:700;line-height:1}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.q-name{font-weight:700;font-size:13px;color:#111}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;color:#555;margin-bottom:8px}
.q-grid b{color:#111}
.q-total-box{background:#f0f6ff;border-radius:8px;padding:10px 12px;margin-top:6px}
.q-total-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.q-total-row:last-child{margin-bottom:0}
.q-total-label{color:#555}
.q-total-val{font-weight:700;color:#111}
.q-grand{font-size:15px!important;font-weight:900!important;color:#0067c5!important}
.q-enganche-box{background:#fff8e1;border-radius:8px;padding:10px 12px;margin-top:6px;border:1px solid #ffe082}
.quotes-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.btn-clear{font-size:12px;color:#e53935;background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600}
.q-footer{background:#f0faf5;border-radius:10px;padding:10px 12px;font-size:13px;color:#555;margin-top:4px}
.info-banner{border-radius:12px;padding:14px;color:#fff;margin-bottom:12px}
.empty{text-align:center;color:#bbb;padding:28px 0;font-size:13px}
.empty span{font-size:36px;display:block;margin-bottom:8px}
.no-dev{text-align:center;color:#bbb;padding:14px 0;font-size:13px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">AT&amp;T</div>
  <div><h1>Cotizador AT&amp;T</h1><p>Planes tarifarios con equipo celular</p></div>
</div>
<div class="container">
  <div class="card">
    <div class="card-title">👤 Nombre del Cliente</div>
    <input type="text" id="clientName" placeholder="Ej. Juan Pérez"/>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('premium',this)">🏆 Premium</button>
    <button class="tab-btn" onclick="setTab('simple',this)">📦 Simple Plus</button>
    <button class="tab-btn" onclick="setTab('titanio',this)">💠 Titanio</button>
    <button class="tab-btn" onclick="setTab('prepago',this)">💳 Prepago</button>
  </div>
  <div id="planSection" class="card">
    <div class="card-title">1. Selecciona Plan</div>
    <div id="planContainer"></div>
  </div>
  <div id="infoBanner" style="display:none"></div>
  <div class="card">
    <div class="card-title" id="devTitle">2. Selecciona Equipo</div>
    <input type="text" id="searchInput" placeholder="Buscar equipo o marca..." oninput="renderDevices()" style="margin-bottom:10px"/>
    <div class="device-list" id="deviceList"></div>
  </div>
  <div class="card" id="summaryCard">
    <div class="card-title">📊 Resumen</div>
    <div id="summaryContent"><div class="empty"><span>📋</span>Selecciona un equipo</div></div>
    <button class="btn-add" id="btnAdd" onclick="addQuote()" disabled>＋ Agregar a Cotización</button>
  </div>
  <div class="card" id="quotesCard" style="display:none">
    <div class="quotes-hdr">
      <div class="card-title" style="margin:0" id="quotesTitle">📋 Cotización</div>
      <button class="btn-clear" onclick="clearAll()">Limpiar todo</button>
    </div>
    <div id="quotesList"></div>
    <div class="q-footer" id="quotesFooter"></div>
  </div>
</div>

const TITANIO_DEVICES=[{"marca": "APPLE", "equipo": "Apple iPhone 17 256GB", "precio_contado": 19999.0, "mensualidad_equipo": 0.0}, {"marca": "APPLE", "equipo": "Apple iPhone Air 256GB", "precio_contado": 25999.0, "mensualidad_equipo": 5976.0}, {"marca": "APPLE", "equipo": "Apple iPhone 17 Pro 256GB", "precio_contado": 28499.0, "mensualidad_equipo": 7176.0}, {"marca": "APPLE", "equipo": "Apple iPhone 17 Pro Max 256GB", "precio_contado": 30999.0, "mensualidad_equipo": 9576.0}];

let tab='premium', plan=null, plazo='24m', device=null, quotes=[];
let enganchePct=0; // porcentaje de enganche actual en el formulario

const fmt=n=>n?'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const fmtI=n=>n?'$'+Number(n).toLocaleString('es-MX'):'—';

function getDevices(){if(tab==='premium')return PREMIUM_DEVICES;if(tab==='simple')return SIMPLE_DEVICES;if(tab==='titanio')return TITANIO_DEVICES;return PREPAGO_DEVICES;}
function getPlans(){return tab==='premium'?PREMIUM_PLANS:tab==='simple'?SIMPLE_PLANS:[];}
function getPlazoOpts(){return tab==='premium'?['24m','30m','36m']:tab==='simple'?['12m','18m','24m']:['24m'];}

function setTab(t,btn){
  tab=t;plan=null;plazo=tab==='simple'?'12m':'24m';device=null;enganchePct=0;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value='';
  renderAll();
}

function renderAll(){renderPlanSection();renderDevices();renderSummary();}

function renderPlanSection(){
  const ps=document.getElementById('planSection');
  const ib=document.getElementById('infoBanner');
  const dt=document.getElementById('devTitle');
  if(tab==='premium'||tab==='simple'){
    ps.style.display='block';ib.style.display='none';dt.textContent='2. Selecciona Equipo';
    const plans=getPlans();
    let html='<div class="plans-grid">';
    plans.forEach(p=>{
      const sel=plan&&plan.id===p.id?'sel':'';
      const c=PLAN_COLORS[p.name]||'#1589f0';
      html+=`<button class="plan-btn ${sel}" onclick="selectPlan('${p.id}')" style="${sel?'border-color:'+c:''}">
        <div class="plan-name" style="color:${c}">${p.name}</div>
        <div class="plan-detail">${p.gb||''} · ${fmtI(p.monthly)}/mes</div>
      </button>`;
    });
    html+='</div>';
    if(plan){
      html+='<div style="margin-top:10px"><div style="font-weight:600;font-size:13px;color:#555;margin-bottom:8px">Plazo:</div><div class="plazo-row">';
      getPlazoOpts().forEach(p=>{
        html+=`<button class="plazo-btn ${plazo===p?'sel':''}" onclick="selectPlazo('${p}')">${p.replace('m',' meses')}</button>`;
      });
      html+='</div></div>';
    }
    document.getElementById('planContainer').innerHTML=html;
  } else if(tab==='titanio'){
    ps.style.display='none';dt.textContent='1. Selecciona Equipo';
    ib.style.display='block';
    ib.innerHTML='<div class="info-banner" style="background:linear-gradient(135deg,#5d4037,#8d6e63)"><div style="font-weight:800;font-size:16px">💠 Plan Titanio</div><div style="font-size:13px;opacity:.9;margin-top:4px">42 GB · $1,599/mes · 24 meses</div></div>';
  } else {
    ps.style.display='none';dt.textContent='1. Selecciona Equipo';
    ib.style.display='block';
    ib.innerHTML='<div class="info-banner" style="background:linear-gradient(135deg,#1565c0,#42a5f5)"><div style="font-weight:800;font-size:16px">💳 Prepago</div><div style="font-size:13px;opacity:.9;margin-top:4px">Compra directa · Sin plan mensual</div></div>';
  }
}

function selectPlan(id){plan=getPlans().find(p=>p.id===id);device=null;renderAll();}
function selectPlazo(p){plazo=p;renderPlanSection();renderSummary();}

function renderDevices(){
  const s=document.getElementById('searchInput').value.toLowerCase();
  const devs=getDevices().filter(d=>!s||d.equipo.toLowerCase().includes(s)||d.marca.toLowerCase().includes(s));
  let html='';
  if(!devs.length){html='<div class="no-dev">Sin resultados</div>';}
  else devs.forEach((d,i)=>{
    const sel=device&&device.equipo===d.equipo&&device.marca===d.marca?'sel':'';
    const price=tab==='prepago'?`Promo: ${fmtI(d.precio_promo)}`:`Contado: ${fmtI(d.precio_contado)}`;
    html+=`<div class="device-item ${sel}" onclick="selectDevice(${i})">
      <span class="d-icon">${ICONS[d.marca]||'📱'}</span>
      <div><div class="d-name">${d.equipo}</div><div class="d-price">${price}</div></div>
    </div>`;
  });
  document.getElementById('deviceList').innerHTML=html;
}

function selectDevice(idx){
  const s=document.getElementById('searchInput').value.toLowerCase();
  const devs=getDevices().filter(d=>!s||d.equipo.toLowerCase().includes(s)||d.marca.toLowerCase().includes(s));
  device=devs[idx];
  renderDevices();
  renderSummary();
}

function setPct(pct){
  enganchePct=pct;
  document.getElementById('pctInput').value=pct;
  renderSummary();
}

function onPctInput(){
  const v=parseFloat(document.getElementById('pctInput').value)||0;
  enganchePct=Math.min(100,Math.max(0,v));
  renderSummary();
}

function renderSummary(){
  const content=document.getElementById('summaryContent');
  const btn=document.getElementById('btnAdd');
  if(!device){content.innerHTML='<div class="empty"><span>📋</span>Selecciona un equipo</div>';btn.disabled=true;return;}
  const needsPlan=tab==='premium'||tab==='simple';
  if(needsPlan&&!plan){content.innerHTML='<div class="no-dev">← Selecciona primero un plan</div>';btn.disabled=true;return;}
  btn.disabled=false;

  let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
    <span style="font-size:26px">${ICONS[device.marca]||'📱'}</span>
    <div><div style="font-weight:800;font-size:14px;color:#111">${device.equipo}</div>
    <div style="font-size:11px;color:#888">${device.marca}</div></div></div>`;

  // enganche section (solo para planes con precio de contado)
  const showEnganche = tab!=='prepago';
  const precioContado = device.precio_contado||0;

  if(tab==='prepago'){
    html+=`<div class="summary-box" style="background:#f0faf5">
      <div class="s-row"><span class="s-label">Precio de lista</span><span style="font-weight:600;text-decoration:line-through;color:#999">${fmtI(device.precio_lista)}</span></div>
      <div class="s-row"><span class="s-label" style="color:#00897b;font-weight:700">Precio promo</span><span style="font-weight:900;color:#00897b;font-size:18px">${fmtI(device.precio_promo)}</span></div>
      <div style="font-size:11px;color:#888;margin-top:4px">Sin plan mensual · Pago de contado</div></div>`;
  } else if(tab==='titanio'){
    const mp=1599;
    const costoEquipo=device.mensualidad_equipo*24||0; // costo total financiado del equipo en titanio
    const engancheAmt=Math.round(costoEquipo*(enganchePct/100)*100)/100;
    const saldoFinanciar=costoEquipo-engancheAmt;
    const me=costoEquipo>0 ? Math.round((saldoFinanciar/24)*100)/100 : 0;
    const total=mp+(me>0?me:0);
    html+=buildSummaryBox({planName:'Titanio',gb:'42GB',mp,me,total,plazoLabel:'24 meses',costoFinanciado:costoEquipo,engancheAmt,enganchePct,showEnganche:true});
  } else if(tab==='simple'){
    const ct=device.planes?.[plan.name]?.[plazo]||0;
    const meses=parseInt(plazo);
    const mp=plan.monthly;
    // Costo total financiado del equipo = costo total contrato - (plan * meses)
    const costoEquipo=ct-(mp*meses);
    const engancheAmt=Math.round(costoEquipo*(enganchePct/100)*100)/100;
    const saldoFinanciar=costoEquipo-engancheAmt;
    const me=Math.round((saldoFinanciar/meses)*100)/100;
    html+=`<div class="summary-box" style="background:#f5f8ff">
      <span class="badge" style="background:${PLAN_COLORS[plan.name]||'#1589f0'}">${plan.name}</span>
      <div class="s-row"><span class="s-label">Mensualidad plan</span><span class="s-val">${fmtI(mp)}/mes</span></div>
      <div class="s-row"><span class="s-label">Mensualidad equipo (${plazo.replace('m',' meses')})</span><span style="font-weight:700;color:#c8a000">${fmt(me)}</span></div>
      <div style="height:1px;background:#d0d7df;margin:8px 0"></div>
      <div class="s-row"><span class="s-label" style="color:#0067c5;font-weight:700">Total mensual</span><span style="font-weight:900;color:#0067c5;font-size:15px">${fmt(mp+me)}</span></div>
      <div class="s-row" style="margin-top:4px"><span class="s-label">Costo total contrato</span><span class="s-val">${fmt(ct)}</span></div>
      <div class="s-row"><span class="s-label">Precio contado</span><span class="s-val">${fmtI(precioContado)}</span></div>
    </div>`;
    html+=buildEngancheSection(costoEquipo,engancheAmt,enganchePct,meses);
  } else {
    // premium: el valor de BD es el costo total financiado del equipo (no la mensualidad)
    const meses=parseInt(plazo);
    const costoEquipo=device.planes?.[plan.name]?.[plazo]||0;
    const engancheAmt=Math.round(costoEquipo*(enganchePct/100)*100)/100;
    const saldoFinanciar=costoEquipo-engancheAmt;
    const me=Math.round((saldoFinanciar/meses)*100)/100;
    const mp=plan.monthly;
    const total=mp+me;
    html+=buildSummaryBox({planName:plan.name,gb:plan.gb,mp,me,total,plazoLabel:plazo.replace('m',' meses'),costoFinanciado:costoEquipo,engancheAmt,enganchePct,showEnganche:true,meses});
  }

  content.innerHTML=html;
}

function buildSummaryBox({planName,gb,mp,me,total,plazoLabel,costoFinanciado,engancheAmt,enganchePct,showEnganche,meses}){
  const c=PLAN_COLORS[planName]||'#1589f0';
  let html=`<div class="summary-box" style="background:#f5f8ff">
    <span class="badge" style="background:${c}">${planName}${gb?' · '+gb:''}</span>
    <div class="s-row"><span class="s-label">Mensualidad plan</span><span class="s-val">${fmtI(mp)}/mes</span></div>
    <div class="s-row"><span class="s-label">Mensualidad equipo (${plazoLabel})</span><span style="font-weight:700;color:#c8a000">${fmt(me)}</span></div>
    <div style="height:1px;background:#d0d7df;margin:8px 0"></div>
    <div class="s-row"><span class="s-label" style="color:#0067c5;font-weight:700">Total mensual</span><span style="font-weight:900;color:#0067c5;font-size:15px">${fmt(total)}</span></div>
  </div>`;
  if(showEnganche) html+=buildEngancheSection(costoFinanciado,engancheAmt,enganchePct,meses);
  return html;
}

function buildEngancheSection(costoFinanciado,engancheAmt,enganchePct,meses){
  const saldo=costoFinanciado-engancheAmt;
  const mensualidadConEnganche=meses?Math.round((saldo/meses)*100)/100:0;
  return `<div style="margin-bottom:12px">
    <div style="font-weight:600;font-size:13px;color:#555;margin-bottom:8px">💰 Pago Inicial (Enganche)</div>
    <div class="enganche-row">
      <button class="pct-btn ${enganchePct===10?'sel':''}" onclick="setPct(10)">10%</button>
      <button class="pct-btn ${enganchePct===20?'sel':''}" onclick="setPct(20)">20%</button>
      <button class="pct-btn ${enganchePct===30?'sel':''}" onclick="setPct(30)">30%</button>
      <button class="pct-btn ${enganchePct===0?'sel':''}" onclick="setPct(0)">Sin enganche</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <span style="font-size:13px;color:#555;white-space:nowrap">O ingresar %:</span>
      <input type="number" id="pctInput" class="enganche-input" min="0" max="100" value="${enganchePct}" oninput="onPctInput()" placeholder="0"/>
    </div>
    ${enganchePct>0?`<div style="background:#fff8e1;border-radius:8px;padding:10px 12px;margin-top:10px;border:1px solid #ffe082">
      <div class="s-row"><span class="s-label">Costo total financiado</span><span class="s-val">${fmt(costoFinanciado)}</span></div>
      <div class="s-row"><span class="s-label">Enganche (${enganchePct}%)</span><span style="font-weight:800;color:#e65100;font-size:14px">${fmt(engancheAmt)}</span></div>
      <div style="height:1px;background:#ffe082;margin:6px 0"></div>
      <div class="s-row"><span class="s-label" style="color:#555">Saldo restante a financiar</span><span style="font-weight:700;color:#555">${fmt(saldo)}</span></div>
      <div class="s-row" style="margin-top:4px"><span class="s-label" style="color:#0067c5;font-weight:700">Nueva mensualidad equipo</span><span style="font-weight:900;color:#0067c5">${fmt(mensualidadConEnganche)}/mes</span></div>
    </div>`:''}
  </div>`;
}

function addQuote(){
  if(!device)return;
  let q={marca:device.marca,equipo:device.equipo,enganchePct,engancheAmt:0};
  const pc=device.precio_contado||0;

  if(tab==='prepago'){
    q={...q,tipo:'prepago',planName:'Prepago',precio_lista:device.precio_lista,precio_promo:device.precio_promo};
  } else if(tab==='titanio'){
    const costoEquipo=device.mensualidad_equipo*24||0;
    const engancheAmt=Math.round(costoEquipo*(enganchePct/100)*100)/100;
    const saldo=costoEquipo-engancheAmt;
    const me=costoEquipo>0 ? Math.round((saldo/24)*100)/100 : 0;
    q={...q,tipo:'titanio',planName:'Titanio',precio_contado:pc,costoFinanciado:costoEquipo,engancheAmt,mensualidadEquipo:me,mensualidadPlan:1599,totalMensual:1599+me,plazo:'24 meses'};
  } else if(tab==='simple'){
    const ct=device.planes?.[plan.name]?.[plazo]||0;
    const meses=parseInt(plazo);
    const mp=plan.monthly;
    const costoEquipo=ct-(mp*meses);
    const engancheAmt=Math.round(costoEquipo*(enganchePct/100)*100)/100;
    const saldo=costoEquipo-engancheAmt;
    const me=Math.round((saldo/meses)*100)/100;
    q={...q,tipo:'simple',planName:plan.name,mensualidadPlan:mp,mensualidadEquipo:me,totalMensual:mp+me,costoTotal:ct,costoFinanciado:costoEquipo,engancheAmt,plazo:plazo.replace('m',' meses'),precio_contado:pc};
  } else {
    // premium: valor de BD = costo total financiado del equipo
    const meses=parseInt(plazo);
    const costoEquipo=device.planes?.[plan.name]?.[plazo]||0;
    const engancheAmt=Math.round(costoEquipo*(enganchePct/100)*100)/100;
    const saldo=costoEquipo-engancheAmt;
    const me=Math.round((saldo/meses)*100)/100;
    const mp=plan.monthly;
    q={...q,tipo:'premium',planName:plan.name,gb:plan.gb,mensualidadPlan:mp,mensualidadEquipo:me,totalMensual:mp+me,costoFinanciado:costoEquipo,engancheAmt,plazo:plazo.replace('m',' meses'),precio_contado:pc};
  }
  quotes.push(q);
  device=null;enganchePct=0;
  renderDevices();renderSummary();renderQuotes();
}

function removeQuote(i){quotes.splice(i,1);renderQuotes();}
function clearAll(){quotes=[];renderQuotes();}

function renderQuotes(){
  const card=document.getElementById('quotesCard');
  if(!quotes.length){card.style.display='none';return;}
  card.style.display='block';
  const cn=document.getElementById('clientName').value;
  document.getElementById('quotesTitle').textContent='📋 Cotización'+(cn?' — '+cn:'');
  let html='';
  quotes.forEach((q,i)=>{
    const c=PLAN_COLORS[q.planName]||'#1589f0';
    let body='';

    if(q.tipo==='prepago'){
      body=`<div class="q-grid">
        <div>Precio lista: <b style="text-decoration:line-through;color:#999">${fmtI(q.precio_lista)}</b></div>
        <div>Precio promo: <b style="color:#00897b">${fmtI(q.precio_promo)}</b></div>
        <div style="grid-column:1/-1">Modalidad: <b>Pago de contado</b></div>
      </div>`;
    } else {
      // mensualidad breakdown
      body=`<div class="q-total-box">
        <div class="q-total-row">
          <span class="q-total-label">📋 Plan ${q.planName}${q.gb?' ('+q.gb+')':''}</span>
          <span class="q-total-val">${fmtI(q.mensualidadPlan)}/mes</span>
        </div>
        <div class="q-total-row">
          <span class="q-total-label">📱 Equipo (${q.plazo})</span>
          <span style="font-weight:700;color:#c8a000">${fmt(q.mensualidadEquipo)}/mes</span>
        </div>
        <div style="height:1px;background:#d0dff0;margin:6px 0"></div>
        <div class="q-total-row">
          <span class="q-total-label q-grand">💳 Total mensual</span>
          <span class="q-total-val q-grand">${fmt(q.totalMensual)}/mes</span>
        </div>
        ${q.tipo==='simple'?`<div class="q-total-row" style="margin-top:4px"><span class="q-total-label" style="font-size:11px;color:#888">Costo total contrato</span><span style="font-size:11px;color:#888">${fmt(q.costoTotal)}</span></div>`:''}
        <div class="q-total-row" style="margin-top:4px">
          <span class="q-total-label" style="font-size:11px;color:#888">Precio contado</span>
          <span style="font-size:11px;color:#888">${fmtI(q.precio_contado)}</span>
        </div>
      </div>`;

      if(q.enganchePct>0){
        body+=`<div class="q-enganche-box" style="margin-top:6px">
          <div class="q-total-row"><span class="q-total-label">💰 Enganche (${q.enganchePct}%)</span><span style="font-weight:800;color:#e65100">${fmt(q.engancheAmt)}</span></div>
          <div class="q-total-row"><span class="q-total-label" style="font-size:11px;color:#888">Saldo a financiar</span><span style="font-size:11px;color:#888">${fmt(q.costoFinanciado-q.engancheAmt)}</span></div>
        </div>`;
      }
    }

    html+=`<div class="quote-card">
      <button class="q-remove" onclick="removeQuote(${i})">×</button>
      <div class="q-header">
        <span style="font-size:22px">${ICONS[q.marca]||'📱'}</span>
        <div><div class="q-name">${q.equipo}</div><span class="badge" style="background:${c}">${q.planName}</span></div>
      </div>
      ${body}
    </div>`;
  });

  document.getElementById('quotesList').innerHTML=html;
  const today=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('quotesFooter').innerHTML=`<b>${quotes.length}</b> equipo(s) cotizado(s) · ${today}`;
}

renderAll();
</script>
</body>
</html>
